services:
  mongodb:
    build:
      context: .
      dockerfile: Dockerfile.mongo  # Use the custom Dockerfile for MongoDB
    ports:
      - "27020:27017"  # Expose MongoDB on port 27020
    environment:
      - MONGO_INITDB_DATABASE=persabe30072025
    volumes:
      - mongo_data:/data/db
      - ./dump:/dump:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  webapp:
    build: .  # This will use your existing Node.js Dockerfile
    ports:
      - "4002:4002"  # Expose your Node.js app on port 4002
    environment:
      - NODE_ENV=production
      - HTTP_PORT=4002
      - MONGO_URL=mongodb://mongodb:27017/persabe30072025
      - LOG_PATH=/usr/src/app/codabe/admineex/logs
    volumes:
      - ./logs:/usr/src/app/codabe/admineex/logs
      - ./uploads:/usr/src/app/codabe/admineex/server/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
